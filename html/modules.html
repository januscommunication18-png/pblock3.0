  <script>
    // Mobile sidebar drawer
    (function () {
      var sb = document.getElementById('sidebar'), bd = document.getElementById('sidebar-backdrop');
      var o = document.getElementById('open-sidebar'); if (o) o.addEventListener('click', function () { sb.classList.remove('-translate-x-full'); bd.classList.remove('hidden'); });
      var c = document.getElementById('close-sidebar'); if (c) c.addEventListener('click', function () { sb.classList.add('-translate-x-full'); bd.classList.add('hidden'); });
      if (bd) bd.addEventListener('click', function () { sb.classList.add('-translate-x-full'); bd.classList.add('hidden'); });
    })();

    (function () {
      var MOD_STATUS = {
        planned: { label: 'Planned', color: '#2563eb', bg: '#eff6ff' },
        backlog: { label: 'Backlog', color: '#6b7280', bg: '#f3f4f6' },
        inprogress: { label: 'In Progress', color: '#d97706', bg: '#fef3c7' },
        paused: { label: 'Paused', color: '#6b7280', bg: '#f3f4f6' },
        completed: { label: 'Completed', color: '#16a34a', bg: '#dcfce7' },
        cancelled: { label: 'Cancelled', color: '#dc2626', bg: '#fee2e2' }
      };
      var MODULES = [
        { id: 'core-workflow', name: 'Core Workflow (System)', pct: 25, dates: 'Aug 08 - 22, 2026', status: 'planned', lead: 'Z', star: false },
        { id: 'onboarding-flow', name: 'Onboarding Flow (Feature)', pct: 0, dates: 'Aug 10 - 24, 2026', status: 'backlog', lead: 'S', star: false },
        { id: 'workspace-setup', name: 'Workspace Setup (Area)', pct: 0, dates: 'Aug 12 - 26, 2026', status: 'inprogress', lead: 'J', star: false }
      ];
      function ring(pct) {
        var r = 8.5, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
        return '<span class="relative inline-grid place-items-center shrink-0" style="width:30px;height:30px"><svg width="30" height="30" viewBox="0 0 24 24"><circle cx="12" cy="12" r="' + r + '" fill="none" stroke="#e5e7eb" stroke-width="2.4"/><circle cx="12" cy="12" r="' + r + '" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 12 12)"/></svg><span class="absolute text-[8px] font-semibold text-sub">' + pct + '%</span></span>';
      }
      function star(on) { return on ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="text-warning"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9L12 3z"/></svg>' : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9L12 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'; }
      var IC_MENU = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>';
      var CAL_SM = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" class="text-faint shrink-0"><rect x="4" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
      var CHK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" class="text-brand shrink-0"><path d="M5 12l5 5 9-11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      var STATUS_OPTS = Object.keys(MOD_STATUS).map(function (k) { return { key: k, label: MOD_STATUS[k].label, color: MOD_STATUS[k].color, bg: MOD_STATUS[k].bg }; });
      var MEMBERS = [
        { key: 'Z', label: 'Zora', initial: 'Z', color: '#1b5f8a' },
        { key: 'S', label: 'Sam', initial: 'S', color: '#0891b2' },
        { key: 'J', label: 'Jai', initial: 'J', color: '#7c3aed' },
        { key: 'A', label: 'Aria', initial: 'A', color: '#db2777' },
        { key: 'M', label: 'Milo', initial: 'M', color: '#ca8a04' }
      ];
      var MEMBERS_MAP = {}; MEMBERS.forEach(function (m) { MEMBERS_MAP[m.key] = m; });
      function statusDot(o) { return '<span class="h-2.5 w-2.5 rounded-full shrink-0" style="background:' + o.color + '"></span>'; }
      function avatarIc(o) { return '<span class="h-5 w-5 rounded-full grid place-items-center text-white text-[9px] font-bold shrink-0" style="background:' + o.color + '">' + o.initial + '</span>'; }

      function nameFmt(cell) { var m = cell.getData(); return '<div class="flex items-center gap-3 min-w-0">' + ring(m.pct) + '<span class="text-[14px] text-ink truncate">' + m.name + '</span></div>'; }
      function metaFmt(cell) {
        var m = cell.getData(), s = MOD_STATUS[m.status];
        var lead = MEMBERS_MAP[m.lead] || { initial: m.lead, color: '#1b5f8a' };
        return '<div class="flex items-center justify-end gap-2">' +
          '<button data-mact="dates" data-id="' + m.id + '" class="inline-flex items-center gap-1.5 h-6 px-2 rounded-md border border-stroke bg-white text-[12px] text-sub whitespace-nowrap hover:bg-hover" title="Set dates">' + CAL_SM + m.dates + '</button>' +
          '<button data-mact="status" data-id="' + m.id + '" class="inline-flex items-center h-6 px-2.5 rounded-md text-[12px] font-medium whitespace-nowrap hover:brightness-95" style="color:' + s.color + ';background:' + s.bg + '" title="Set status">' + s.label + '</button>' +
          '<button data-mact="lead" data-id="' + m.id + '" class="h-6 w-6 rounded-full text-white grid place-items-center text-[10px] font-bold" style="background:' + lead.color + '" title="Set lead">' + lead.initial + '</button>' +
          '<button data-star="' + m.id + '" class="h-7 w-7 grid place-items-center rounded hover:bg-line ' + (m.star ? '' : 'text-faint') + '" title="Favorite">' + star(m.star) + '</button>' +
          '<button data-mmenu="' + m.id + '" class="h-7 w-7 grid place-items-center rounded hover:bg-line text-faint" title="More">' + IC_MENU + '</button>' +
        '</div>';
      }
      var table = new Tabulator('#mod-table', {
        data: MODULES, index: 'id', layout: 'fitColumns', headerVisible: false, rowHeight: 52,
        columnDefaults: { vertAlign: 'middle', headerSort: false, resizable: false },
        columns: [
          { title: 'Name', field: 'name', widthGrow: 1, formatter: nameFmt },
          { title: 'meta', width: 360, hozAlign: 'right', formatter: metaFmt }
        ]
      });
      table.on('rowClick', function (e, row) { if (e.target.closest('button')) return; location.href = 'module.html?name=' + encodeURIComponent(row.getData().name); });

      /* ============ shared floating pickers ============ */
      var pop = document.getElementById('mod-pop');
      var dp = document.getElementById('mod-dp');
      function closePops() { pop.classList.add('hidden'); dp.classList.add('hidden'); }
      function placePop(el, anchor) {
        el.classList.remove('hidden');
        var r = anchor.getBoundingClientRect();
        var top = r.bottom + 6; if (top + el.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - el.offsetHeight - 6);
        var left = r.left; if (left + el.offsetWidth > window.innerWidth - 12) left = window.innerWidth - 12 - el.offsetWidth;
        el.style.top = top + 'px'; el.style.left = Math.max(12, left) + 'px';
      }
      function openPicker(cfg, anchor) {
        closePops();
        var multi = !!cfg.multi;
        var selected = multi ? (cfg.selected ? cfg.selected.slice() : []) : cfg.selected;
        function isSel(k) { return multi ? selected.indexOf(k) > -1 : k === selected; }
        var search = cfg.searchable ? '<div class="relative mb-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" class="absolute left-2.5 top-1/2 -translate-y-1/2 text-faint"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input type="text" class="mp-search w-full h-9 pl-8 pr-3 rounded-md bg-hover text-[13px] text-ink placeholder:text-faint outline outline-1 -outline-offset-1 outline-transparent focus:bg-white focus:outline-stroke" placeholder="' + (cfg.placeholder || 'Search') + '" /></div>' : '';
        function rows(q) {
          q = (q || '').toLowerCase();
          return cfg.options.filter(function (o) { return o.label.toLowerCase().indexOf(q) > -1; }).map(function (o) {
            return '<button type="button" data-k="' + o.key + '" class="w-full text-left flex items-center gap-2.5 px-2 h-9 rounded-md text-[13px] text-ink hover:bg-hover">' + (cfg.icon ? cfg.icon(o) : '') + '<span class="truncate flex-1">' + o.label + '</span>' + (isSel(o.key) ? CHK : '') + '</button>';
          }).join('') || '<div class="px-2 py-3 text-[13px] text-sub text-center">No results</div>';
        }
        pop.innerHTML = search + '<div class="mp-list max-h-60 overflow-y-auto">' + rows('') + '</div>';
        placePop(pop, anchor);
        var s = pop.querySelector('.mp-search'), listEl = pop.querySelector('.mp-list');
        if (s) { s.addEventListener('input', function () { listEl.innerHTML = rows(s.value); }); setTimeout(function () { s.focus(); }, 0); }
        listEl.addEventListener('click', function (e) {
          var b = e.target.closest('[data-k]'); if (!b) return; e.stopPropagation();
          var k = b.getAttribute('data-k');
          if (multi) { var i = selected.indexOf(k); if (i > -1) selected.splice(i, 1); else selected.push(k); cfg.onChange(selected.slice()); listEl.innerHTML = rows(s ? s.value : ''); }
          else { cfg.onPick(k); closePops(); }
        });
      }

      /* ============ compact date-range picker (daterangepicker style) ============ */
      var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var DOW = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
      var TODAY = new Date(2026, 7, 9);
      function d0(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
      function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
      function ymd(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
      function sameD(a, b) { return a && b && ymd(a) === ymd(b); }
      function labelD(d) { return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
      function pad2(n) { return (n < 10 ? '0' : '') + n; }
      function rangeStr(s, e) { if (s.getFullYear() === e.getFullYear() && s.getMonth() === e.getMonth()) return MON[s.getMonth()] + ' ' + pad2(s.getDate()) + ' - ' + pad2(e.getDate()) + ', ' + e.getFullYear(); return MON[s.getMonth()] + ' ' + pad2(s.getDate()) + ' - ' + MON[e.getMonth()] + ' ' + pad2(e.getDate()) + ', ' + e.getFullYear(); }

      function openRange(anchor, cur, onApply) {
        closePops();
        var start = cur && cur.start ? d0(cur.start) : null, end = cur && cur.end ? d0(cur.end) : null, hover = null;
        var view = new Date((start || TODAY).getFullYear(), (start || TODAY).getMonth(), 1);
        var PRESETS = [
          { k: 'today', label: 'Today', r: function () { return [TODAY, TODAY]; } },
          { k: 'yesterday', label: 'Yesterday', r: function () { return [addDays(TODAY, -1), addDays(TODAY, -1)]; } },
          { k: 'l7', label: 'Last 7 Days', r: function () { return [addDays(TODAY, -6), TODAY]; } },
          { k: 'l30', label: 'Last 30 Days', r: function () { return [addDays(TODAY, -29), TODAY]; } },
          { k: 'tm', label: 'This Month', r: function () { return [new Date(TODAY.getFullYear(), TODAY.getMonth(), 1), new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0)]; } },
          { k: 'lm', label: 'Last Month', r: function () { return [new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1), new Date(TODAY.getFullYear(), TODAY.getMonth(), 0)]; } }
        ];
        function activePreset() { if (!start || !end) return null; for (var i = 0; i < PRESETS.length; i++) { var rr = PRESETS[i].r(); if (sameD(rr[0], start) && sameD(rr[1], end)) return PRESETS[i].k; } return 'custom'; }
        function inRange(d) { if (!start) return false; var e = end || hover; if (!e) return false; var lo = Math.min(ymd(start), ymd(e)), hi = Math.max(ymd(start), ymd(e)); return ymd(d) > lo && ymd(d) < hi; }
        function grid(base) {
          var y = base.getFullYear(), m = base.getMonth(), first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), cells = '';
          for (var i = 0; i < first; i++) cells += '<div class="h-7"></div>';
          for (var d = 1; d <= days; d++) {
            var dt = new Date(y, m, d), isS = sameD(dt, start), isE = sameD(dt, (end || hover)), isI = inRange(dt);
            var cls = 'h-7 grid place-items-center text-[11px] cursor-pointer ';
            if (isS || isE) cls += 'bg-brand text-white font-semibold ' + (isS && isE ? 'rounded-md' : isS ? 'rounded-l-md' : 'rounded-r-md');
            else if (isI) cls += 'bg-sel text-brand'; else cls += 'text-ink rounded-md hover:bg-hover';
            cells += '<div data-day="' + ymd(dt) + '" class="' + cls + '">' + d + '</div>';
          }
          return '<div class="w-[168px]"><div class="text-center text-[12px] font-semibold text-head mb-1.5">' + MONTHS[m] + ' ' + y + '</div><div class="grid grid-cols-7 mb-0.5">' + DOW.map(function (w) { return '<div class="h-5 grid place-items-center text-[10px] font-semibold text-faint">' + w + '</div>'; }).join('') + '</div><div class="grid grid-cols-7 gap-y-0.5">' + cells + '</div></div>';
        }
        function render() {
          var next = new Date(view.getFullYear(), view.getMonth() + 1, 1), nb = 'h-6 w-6 grid place-items-center rounded-md text-sub hover:bg-hover', act = activePreset();
          var side = PRESETS.map(function (p) { var on = act === p.k; return '<button type="button" data-preset="' + p.k + '" class="text-left h-7 px-2.5 rounded-md text-[12px] whitespace-nowrap ' + (on ? 'bg-brand text-white font-medium' : 'text-ink hover:bg-hover') + '">' + p.label + '</button>'; }).join('');
          side += '<button type="button" data-preset="custom" class="text-left h-7 px-2.5 rounded-md text-[12px] whitespace-nowrap ' + (act === 'custom' ? 'bg-brand text-white font-medium' : 'text-ink hover:bg-hover') + '">Custom Range</button>';
          dp.innerHTML = '<div class="flex"><div class="w-[116px] shrink-0 border-r border-line pr-2 mr-3 flex flex-col gap-0.5">' + side + '</div><div class="min-w-0"><div class="flex items-center mb-1.5"><button type="button" data-nav="-1" class="' + nb + '"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="flex-1"></div><button type="button" data-nav="1" class="' + nb + '"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="flex gap-4">' + grid(view) + grid(next) + '</div></div></div>' +
            '<div class="flex items-center justify-between mt-2.5 pt-2.5 border-t border-line"><div class="text-[11px] text-sub"><span class="text-ink font-medium">' + (start ? labelD(start) : 'Start') + '</span><span class="mx-1.5">→</span><span class="text-ink font-medium">' + (end ? labelD(end) : 'End') + '</span></div><div class="flex items-center gap-1.5"><button type="button" data-dr-clear class="h-7 px-2.5 rounded-md text-[12px] text-sub hover:bg-hover">Clear</button><button type="button" data-dr-apply class="h-7 px-3 rounded-md bg-brand hover:bg-brand-dark text-white text-[12px] font-semibold disabled:opacity-50"' + (start && end ? '' : ' disabled') + '>Apply</button></div></div>';
          placePop(dp, anchor);
        }
        dp._onclick = function (e) {
          e.stopPropagation();
          var pr = e.target.closest('[data-preset]');
          if (pr) { var k = pr.getAttribute('data-preset'); if (k === 'custom') { start = end = hover = null; render(); return; } for (var i = 0; i < PRESETS.length; i++) { if (PRESETS[i].k === k) { var rr = PRESETS[i].r(); start = d0(rr[0]); end = d0(rr[1]); onApply(start, end); closePops(); return; } } return; }
          var nav = e.target.closest('[data-nav]'); if (nav) { view.setMonth(view.getMonth() + (nav.getAttribute('data-nav') === '1' ? 1 : -1)); render(); return; }
          var day = e.target.closest('[data-day]'); if (day) { var v = +day.getAttribute('data-day'), dt = new Date(Math.floor(v / 10000), Math.floor(v / 100) % 100 - 1, v % 100); if (!start || (start && end)) { start = dt; end = null; hover = null; } else { if (ymd(dt) < ymd(start)) { end = start; start = dt; } else { end = dt; } } render(); return; }
          if (e.target.closest('[data-dr-clear]')) { start = end = hover = null; render(); return; }
          if (e.target.closest('[data-dr-apply]')) { if (start && end) { onApply(start, end); closePops(); } return; }
        };
        dp._onover = function (e) { var day = e.target.closest('[data-day]'); if (day && start && !end) { var v = +day.getAttribute('data-day'); if (hover && ymd(hover) === v) return; hover = new Date(Math.floor(v / 10000), Math.floor(v / 100) % 100 - 1, v % 100); render(); } };
        render();
      }
      dp.addEventListener('click', function (e) { if (dp._onclick) dp._onclick(e); });
      dp.addEventListener('mouseover', function (e) { if (dp._onover) dp._onover(e); });
      pop.addEventListener('click', function (e) { e.stopPropagation(); });
      document.addEventListener('click', closePops);
      window.addEventListener('resize', closePops);

      /* ============ editable row badges ============ */
      document.getElementById('mod-table').addEventListener('click', function (e) {
        var s = e.target.closest('[data-star]');
        if (s) { e.stopPropagation(); var row0 = table.getRow(s.getAttribute('data-star')); if (row0) { var d = row0.getData(); d.star = !d.star; row0.update({ star: d.star }); row0.reformat(); } return; }
        if (e.target.closest('[data-mmenu]')) { e.stopPropagation(); return; }
        var el = e.target.closest('[data-mact]'); if (!el) return;
        e.stopPropagation();
        var act = el.getAttribute('data-mact'), row = table.getRow(el.getAttribute('data-id')); if (!row) return;
        var m = row.getData();
        function apply(patch) { var r = row.update(patch); function rf() { try { row.reformat(); } catch (x) {} } if (r && r.then) r.then(rf); else rf(); }
        if (act === 'status') openPicker({ options: STATUS_OPTS, selected: m.status, icon: statusDot, onPick: function (k) { apply({ status: k }); } }, el);
        else if (act === 'lead') openPicker({ options: MEMBERS, selected: m.lead, searchable: true, placeholder: 'Search members', icon: avatarIc, onPick: function (k) { apply({ lead: k }); } }, el);
        else if (act === 'dates') openRange(el, null, function (s2, e2) { apply({ dates: rangeStr(s2, e2) }); });
      });

      /* ============ Create module modal ============ */
      var modal = document.getElementById('module-modal');
      var titleInput = document.getElementById('module-title');
      var createBtn = document.getElementById('module-create');
      var mStatus = null, mLead = null, mMembers = [], mStart = null, mEnd = null;
      var drStart = document.querySelector('#module-daterange [data-dr-start]'), drEnd = document.querySelector('#module-daterange [data-dr-end]');
      var stIc = document.querySelector('#module-status-btn [data-status-ic]'), stLabel = document.querySelector('#module-status-btn [data-status-label]');
      var ldIc = document.querySelector('#module-lead-btn [data-lead-ic]'), ldLabel = document.querySelector('#module-lead-btn [data-lead-label]');
      var mbLabel = document.querySelector('#module-members-btn [data-members-label]');
      function paintModal() {
        drStart.textContent = mStart ? labelD(mStart) : 'Start date'; drStart.className = mStart ? 'text-ink' : 'text-sub';
        drEnd.textContent = mEnd ? labelD(mEnd) : 'End date'; drEnd.className = mEnd ? 'text-ink' : 'text-sub';
        if (mStatus) { var so = MOD_STATUS[mStatus]; stIc.innerHTML = '<span class="h-2.5 w-2.5 rounded-full inline-block" style="background:' + so.color + '"></span>'; stLabel.textContent = so.label; } else { stIc.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3 3"/></svg>'; stLabel.textContent = 'Backlog'; }
        if (mLead) { var lo = MEMBERS_MAP[mLead]; ldIc.innerHTML = avatarIc(lo); ldLabel.textContent = lo.label; } else { ldIc.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M5 20a7 7 0 0114 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'; ldLabel.textContent = 'Lead'; }
        mbLabel.textContent = mMembers.length ? mMembers.length + ' member' + (mMembers.length > 1 ? 's' : '') : 'Members';
      }
      function open() { titleInput.value = ''; createBtn.disabled = true; mStatus = null; mLead = null; mMembers = []; mStart = null; mEnd = null; paintModal(); closePops(); modal.classList.remove('hidden'); setTimeout(function () { titleInput.focus(); }, 0); }
      function close() { closePops(); modal.classList.add('hidden'); }
      document.getElementById('add-module-btn').addEventListener('click', open);
      titleInput.addEventListener('input', function () { createBtn.disabled = titleInput.value.trim() === ''; });
      document.getElementById('module-daterange').addEventListener('click', function (e) { e.stopPropagation(); openRange(this, { start: mStart, end: mEnd }, function (s, en) { mStart = s; mEnd = en; paintModal(); }); });
      document.getElementById('module-status-btn').addEventListener('click', function (e) { e.stopPropagation(); openPicker({ options: STATUS_OPTS, selected: mStatus, icon: statusDot, onPick: function (k) { mStatus = k; paintModal(); } }, this); });
      document.getElementById('module-lead-btn').addEventListener('click', function (e) { e.stopPropagation(); openPicker({ options: MEMBERS, selected: mLead, searchable: true, placeholder: 'Search members', icon: avatarIc, onPick: function (k) { mLead = k; paintModal(); } }, this); });
      document.getElementById('module-members-btn').addEventListener('click', function (e) { e.stopPropagation(); openPicker({ options: MEMBERS, multi: true, selected: mMembers, searchable: true, placeholder: 'Search members', icon: avatarIc, onChange: function (arr) { mMembers = arr; paintModal(); } }, this); });
      modal.addEventListener('click', function (e) { if (e.target.closest('[data-mod-close]')) close(); });
      createBtn.addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();
  </script>
