<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding · Goals — Project Block</title>

  <!--
    Project Block — Onboarding · Step 3 of 5 · What brings you to Project Block?
    Standalone page. component: OnboardingGoals (route /onboarding/goals).
    Back -> onboarding-role.html · Continue/Skip -> onboarding-workspace.html
  -->

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-white text-ink min-h-screen flex flex-col">

  <div class="h-1 w-full bg-line"><div class="h-full bg-brand" style="width:60%"></div></div>

  <header class="flex items-center justify-between px-5 sm:px-10 py-5">
    <div class="flex items-center gap-3">
      <a href="onboarding-role.html" class="h-8 w-8 grid place-items-center rounded-md text-sub hover:bg-hover">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="flex items-center gap-2" href="#">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="#0f0f10"><path d="M5 21 L15 4 L20.5 4 L10.5 21 Z"/><path d="M13 28 L23 11 L28.5 11 L18.5 28 Z"/></svg>
        <span class="text-[18px] font-bold tracking-tight text-head">Project Block</span>
      </a>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-2 border border-line rounded-full pl-1 pr-3 py-1 text-[13px] text-ink">
        <span class="h-5 w-5 rounded-full bg-emerald-500 grid place-items-center text-white text-[9px] font-bold">R</span>
        <span>Rohit Philip</span>
      </div>
      <button onclick="location.href='signup.html'" title="Log out" aria-label="Log out"
        class="flex items-center gap-1.5 h-8 px-3 rounded-full border border-line text-[13px] text-sub hover:bg-hover hover:text-ink transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H6a2 2 0 01-2-2V5a2 2 0 012-2h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="hidden sm:inline">Log out</span>
      </button>
    </div>
  </header>

  <main class="flex-1 flex justify-center px-5">
    <div class="w-full max-w-[430px] py-6 sm:py-12">
      <h1 class="text-[24px] font-bold text-head">What brings you to Project Block?</h1>
      <p class="text-[15px] text-sub mb-7">Tell us your goals and team size.</p>

      <p class="text-[13px] font-medium text-ink mb-3">Select one or more</p>
      <div id="goal-list" class="space-y-2.5"></div>

      <button id="continue" disabled class="mt-6 w-full h-11 rounded-lg text-[14px] font-semibold bg-hover text-faint cursor-not-allowed transition-colors">Continue</button>
      <a href="onboarding-workspace.html" class="block text-center w-full h-9 leading-9 mt-3 text-[14px] font-semibold text-ink hover:underline">Skip</a>
    </div>
  </main>

  <script>
    var GOALS = [
      'Plan and track product roadmaps',
      'Manage engineering sprints',
      'Coordinate cross-functional projects',
      'Replace our current tool',
      'Just exploring'
    ];
    var chosen = [];
    var cont = document.getElementById('continue');

    function box(on) {
      return on
        ? '<span class="h-5 w-5 rounded bg-brand grid place-items-center shrink-0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
        : '<span class="h-5 w-5 rounded border border-stroke shrink-0"></span>';
    }
    function optionClass(sel) {
      return 'option w-full flex items-center gap-3 h-12 px-4 rounded-lg border text-left text-[14px] ' +
        (sel ? 'border-brand ring-1 ring-brand text-brand font-medium' : 'border-stroke text-ink hover:bg-hover');
    }
    function render() {
      document.getElementById('goal-list').innerHTML = GOALS.map(function (g, i) {
        var sel = chosen.indexOf(i) > -1;
        return '<button type="button" class="' + optionClass(sel) + '" data-goal="' + i + '">' + box(sel) + '<span>' + g + '</span></button>';
      }).join('');
      document.querySelectorAll('#goal-list [data-goal]').forEach(function (el) {
        el.onclick = function () {
          var i = +el.getAttribute('data-goal'); var at = chosen.indexOf(i);
          if (at > -1) chosen.splice(at, 1); else chosen.push(i);
          render(); gate();
        };
      });
    }
    function gate() {
      var ok = chosen.length > 0;
      cont.disabled = !ok;
      cont.className = 'mt-6 w-full h-11 rounded-lg text-[14px] font-semibold transition-colors ' +
        (ok ? 'bg-brand hover:bg-brand-dark text-white cursor-pointer' : 'bg-hover text-faint cursor-not-allowed');
    }
    cont.addEventListener('click', function () { if (!cont.disabled) location.href = 'onboarding-workspace.html'; });
    render(); gate();
  </script>
</body>
</html>
