  <script>
    (function () {
      var sb = document.getElementById('sidebar'), bd = document.getElementById('sidebar-backdrop');
      var o = document.getElementById('open-sidebar'); if (o) o.addEventListener('click', function () { sb.classList.remove('-translate-x-full'); bd.classList.remove('hidden'); });
      var c = document.getElementById('close-sidebar'); if (c) c.addEventListener('click', function () { sb.classList.add('-translate-x-full'); bd.classList.add('hidden'); });
      if (bd) bd.addEventListener('click', function () { sb.classList.add('-translate-x-full'); bd.classList.add('hidden'); });
    })();

    (function () {
      var nm = new URLSearchParams(location.search).get('name');
      if (nm) document.getElementById('mwi-name').textContent = nm;

      function dot(color, filled) { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none">' + (filled ? '<circle cx="12" cy="12" r="8" fill="' + color + '"/>' : '<circle cx="12" cy="12" r="8" stroke="' + color + '" stroke-width="2"/>') + '</svg>'; }
      var STATE = {
        backlog: { name: 'Backlog', icon: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3 3"/></svg>' },
        inprogress: { name: 'In Progress', icon: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#f59e0b" stroke-width="2"/><path d="M12 4a8 8 0 010 16z" fill="#f59e0b"/></svg>' },
        done: { name: 'Done', icon: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#22c55e"/><path d="M8 12l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' }
      };
      function bars(c) { return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="4" y="13" width="3.5" height="7" rx="1" fill="' + c + '"/><rect x="10.25" y="9" width="3.5" height="11" rx="1" fill="' + c + '"/><rect x="16.5" y="5" width="3.5" height="15" rx="1" fill="' + c + '"/></svg>'; }
      var PRI = {
        high: { label: 'High', icon: bars('#f97316') },
        urgent: { label: 'Urgent', icon: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" fill="#ef4444"/><path d="M12 7v6M12 16v.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>', cls: 'text-red-600' }
      };
      var CYCLE_DOT = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#3b82f6" stroke-width="1.7" stroke-dasharray="3 3"/></svg>';
      var ITEMS = [
        { id: 'TESTI-4', title: '3. Create and assign Work Items ✏️', state: 'inprogress', priority: 'high', label: 'concepts' },
        { id: 'TESTI-3', title: '2. Invite your team 🤝', state: 'backlog', priority: 'high', label: '' },
        { id: 'TESTI-2', title: '1. Create Projects 🎯', state: 'inprogress', priority: 'high', label: 'concepts' },
        { id: 'TESTI-1', title: 'Welcome to Plane 👋', state: 'done', priority: 'urgent', label: '' }
      ];
      function idFmt(cell) { return '<span class="text-[12px] text-sub">' + cell.getValue() + '</span>'; }
      function titleFmt(cell) { return '<span class="text-[14px] text-ink">' + cell.getValue() + '</span>'; }
      function badge(inner, extra) { return '<span class="inline-flex items-center gap-1.5 h-6 px-2 rounded border border-line bg-white text-[12px] whitespace-nowrap ' + (extra || 'text-ink') + '">' + inner + '</span>'; }
      var IC_CAL = '<span class="h-6 w-6 grid place-items-center rounded-md border border-line bg-white text-faint shrink-0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>';
      var IC_ASSIGNEE = '<span class="h-6 w-6 rounded-full border border-dashed border-stroke grid place-items-center text-faint shrink-0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M5 20a7 7 0 0114 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>';
      var IC_MODULES = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>';
      function metaFmt(cell) {
        var d = cell.getData(), st = STATE[d.state], pr = PRI[d.priority] || PRI.high;
        var label = d.label ? badge('<span class="h-2 w-2 rounded-full" style="background:#8b5cf6"></span>' + d.label) : '';
        return '<div class="flex items-center justify-end gap-1.5 flex-nowrap">' +
          badge(st.icon + st.name) +
          badge(pr.icon + pr.label, pr.cls || 'text-ink') +
          '<span class="hidden xl:inline-flex">' + IC_CAL + '</span>' +
          '<span class="hidden xl:inline-flex">' + IC_CAL + '</span>' +
          '<span class="hidden lg:inline-flex">' + IC_ASSIGNEE + '</span>' +
          '<span class="hidden xl:inline-flex">' + badge(IC_MODULES + '2 modules') + '</span>' +
          '<span class="hidden md:inline-flex">' + badge(CYCLE_DOT + 'Cycle 1: Getting Star…', 'text-ink') + '</span>' +
          (label ? '<span class="hidden lg:inline-flex">' + label + '</span>' : '') +
          '<button class="h-7 w-7 grid place-items-center rounded-md text-sub hover:bg-line shrink-0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button>' +
        '</div>';
      }
      var table = new Tabulator('#mwi-table', {
        data: ITEMS, index: 'id', layout: 'fitColumns', headerVisible: false, rowHeight: 44,
        columnDefaults: { vertAlign: 'middle', headerSort: false, resizable: false },
        groupBy: function () { return 'All work items'; },
        groupHeader: function (value, count) {
          return '<span class="grid place-items-center" style="color:#9ca3af"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/></svg></span><span class="text-[13px] font-semibold" style="color:#0f0f10">All work items</span><span class="text-[11px] font-semibold rounded-full px-1.5 py-0.5" style="color:#6b7280;background:#f3f4f6">' + count + '</span><button type="button" class="ml-auto h-6 w-6 grid place-items-center rounded text-sub hover:bg-line" title="Add work item"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>';
        },
        columns: [
          { title: 'ID', field: 'id', width: 88, formatter: idFmt },
          { title: 'Title', field: 'title', minWidth: 120, widthGrow: 1, formatter: titleFmt },
          { title: 'meta', width: 700, hozAlign: 'right', formatter: metaFmt }
        ]
      });
      table.on('rowClick', function (e, row) { if (e.target.closest('button')) return; location.href = 'work-items.html?item=' + encodeURIComponent(row.getData().id); });
    })();
  </script>
</body>
</html>
