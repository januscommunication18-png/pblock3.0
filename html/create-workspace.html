<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create workspace — Project Block</title>

  <!--
    Project Block — Create workspace (focused / blank layout)
    No app rail or sidebar: just a minimal header (back · title · close)
    over a centered form. component: CreateWorkspace (route /create-workspace).
    Look & feel: Project Block. Tokens in assets/js/tailwind.config.js.
  -->

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-white text-ink min-h-screen flex flex-col">

  <!-- Minimal header: back (left) · title · close (right) -->
  <header class="relative h-14 shrink-0 border-b border-line flex items-center px-4">
    <a href="welcome.html" title="Back" class="h-9 w-9 grid place-items-center rounded-md text-sub hover:bg-hover">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <span class="absolute left-1/2 -translate-x-1/2 font-semibold text-[15px] text-head">Create workspace</span>
    <a href="welcome.html" title="Close" class="ml-auto h-9 w-9 grid place-items-center rounded-md text-sub hover:bg-hover">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
  </header>

  <main class="flex-1 flex justify-center px-5">
    <div class="w-full max-w-[460px] py-10 sm:py-14">
      <h1 class="text-[24px] font-bold text-head mb-8">Create your workspace</h1>

      <!-- Name -->
      <label class="block text-[13px] font-medium text-ink mb-1.5" for="ws-name">Name your workspace <span class="text-danger">*</span></label>
      <input id="ws-name" type="text" placeholder="Something familiar and recognizable is always best." class="pb-input" />

      <!-- URL -->
      <label class="block text-[13px] font-medium text-ink mb-1.5 mt-6">Set your workspace's URL <span class="text-danger">*</span></label>
      <div class="pb-group">
        <span class="pb-group__prefix">app.projectblock.so/</span>
        <input id="ws-slug" type="text" placeholder="Type or paste a URL" class="pb-group__field" />
      </div>

      <!-- Range -->
      <label class="block text-[13px] font-medium text-ink mb-1.5 mt-6">How many people will use this workspace? <span class="text-danger">*</span></label>
      <!-- component: Combobox (Tailwind Plus style) -->
      <div class="relative" id="range-combo">
        <button type="button" id="range-btn" aria-haspopup="listbox" aria-expanded="false" class="pb-input text-left cursor-pointer">
          <span class="flex items-center justify-between h-full">
            <span id="range-value" class="text-faint truncate">Select a range</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-faint shrink-0 ml-2"><path d="M8 9l4-4 4 4M8 15l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
        <ul id="range-list" role="listbox" class="hidden absolute z-30 mt-1 w-full max-h-60 overflow-auto rounded-md bg-white py-1 shadow-lg outline outline-1 outline-black/5"></ul>
      </div>

      <!-- View (Classic / Agile) -->
      <label class="block text-[13px] font-medium text-ink mb-1.5 mt-6">Choose your view <span class="text-danger">*</span></label>
      <div id="view-list" class="grid sm:grid-cols-2 gap-3"></div>

      <!-- Actions -->
      <div class="flex items-center gap-3 mt-8">
        <button id="create" disabled class="h-10 px-5 rounded-md text-[14px] font-semibold bg-hover text-faint cursor-not-allowed transition-colors">Create workspace</button>
        <a href="welcome.html" class="h-10 px-5 grid place-items-center rounded-md border border-stroke text-[14px] font-semibold text-ink hover:bg-hover">Go back</a>
      </div>
    </div>
  </main>

  <script>
    var VIEWS = [
      { k: 'classic', t: 'Classic', d: 'Lists, boards, and cycles — the familiar way.', icon: 'M4 6h16M4 12h16M4 18h10' },
      { k: 'agile',   t: 'Agile',   d: 'Sprints, story points, and a backlog for scrum.', icon: 'M13 2L4.5 13H11l-1 9 8.5-11H12l1-9z' }
    ];
    var view = null;

    var nameEl = document.getElementById('ws-name');
    var slugEl = document.getElementById('ws-slug');
    var range = null;
    var create = document.getElementById('create');

    function cardClass(sel) {
      return 'w-full flex items-start gap-3 p-4 rounded-lg border text-left ' +
        (sel ? 'border-brand ring-1 ring-brand' : 'border-stroke hover:bg-hover');
    }
    function renderViews() {
      document.getElementById('view-list').innerHTML = VIEWS.map(function (v) {
        var sel = view === v.k;
        return '<button type="button" data-view="' + v.k + '" class="' + cardClass(sel) + '">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="mt-0.5 shrink-0 ' + (sel ? 'text-brand' : 'text-sub') + '"><path d="' + v.icon + '" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<div class="min-w-0"><div class="text-[14px] font-medium ' + (sel ? 'text-brand' : 'text-ink') + '">' + v.t + '</div>' +
          '<div class="text-[12px] text-sub mt-0.5">' + v.d + '</div></div>' +
          (sel ? '<span class="ml-auto h-5 w-5 rounded-full bg-brand grid place-items-center shrink-0"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' : '') +
          '</button>';
      }).join('');
      document.querySelectorAll('#view-list [data-view]').forEach(function (el) {
        el.onclick = function () { view = el.getAttribute('data-view'); renderViews(); gate(); };
      });
    }

    function gate() {
      var ok = nameEl.value.trim().length > 0 && !!range && !!view;
      create.disabled = !ok;
      create.className = 'h-10 px-5 rounded-md text-[14px] font-semibold transition-colors ' +
        (ok ? 'bg-brand hover:bg-brand-dark text-white cursor-pointer' : 'bg-hover text-faint cursor-not-allowed');
    }

    nameEl.addEventListener('input', function () {
      slugEl.value = nameEl.value.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      gate();
    });
    slugEl.addEventListener('input', gate);
    create.addEventListener('click', function () { if (!create.disabled) location.href = 'welcome.html'; });

    // Range combobox (Tailwind Plus style)
    var RANGES = ['Just myself', '2-10', '11-50', '51-200', '201-500', '500+'];
    var rBtn = document.getElementById('range-btn');
    var rList = document.getElementById('range-list');
    var rVal = document.getElementById('range-value');
    function renderRanges() {
      rList.innerHTML = RANGES.map(function (r) {
        var sel = range === r;
        return '<li role="option" data-val="' + r + '" class="group relative flex items-center cursor-pointer select-none py-2 pl-3 pr-9 text-[14px] text-ink hover:bg-brand hover:text-white">' +
          '<span class="block truncate">' + r + '</span>' +
          '<span class="' + (sel ? '' : 'hidden ') + 'absolute inset-y-0 right-0 flex items-center pr-3 text-brand group-hover:text-white"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
          '</li>';
      }).join('');
      rList.querySelectorAll('[data-val]').forEach(function (li) {
        li.onclick = function () {
          range = li.getAttribute('data-val');
          rVal.textContent = range;
          rVal.classList.remove('text-faint');
          rVal.classList.add('text-ink');
          closeR(); gate();
        };
      });
    }
    function openR() { renderRanges(); rList.classList.remove('hidden'); rBtn.setAttribute('aria-expanded', 'true'); }
    function closeR() { rList.classList.add('hidden'); rBtn.setAttribute('aria-expanded', 'false'); }
    rBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (rList.classList.contains('hidden')) openR(); else closeR();
    });
    document.addEventListener('click', function (e) {
      if (!document.getElementById('range-combo').contains(e.target)) closeR();
    });

    renderViews();
    gate();
  </script>
</body>
</html>
