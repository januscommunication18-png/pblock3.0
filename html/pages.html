  <style>
    /* Pages list — clean, header-less list, same feel as the Work items grid. Scoped to #pg-table. */
    #pg-table.tabulator { border: none; border-radius: 0; background: #fff; }
    #pg-table .tabulator-tableholder { background: #fff; }
    #pg-table .tabulator-row,
    #pg-table .tabulator-row.tabulator-row-even { background: #fff; }
    #pg-table .tabulator-row { border-bottom: 1px solid #f1f2f4; cursor: pointer; }
    #pg-table .tabulator-row:hover { background: #f8f9fa !important; }
    #pg-table .tabulator-row .tabulator-cell { padding: 0 8px; }
    #pg-table .tabulator-row .tabulator-cell:first-child { padding-left: 24px; }
    #pg-table .tabulator-row .tabulator-cell:last-child { padding-right: 24px; }
    /* right-side row actions reveal on hover (like Work items) */
    #pg-table .pg-hover { opacity: 0; transition: opacity .12s ease; }
    #pg-table .tabulator-row:hover .pg-hover { opacity: 1; }
  </style>

  <script>
    // Mobile sidebar drawer
    (function () {
      var sb = document.getElementById('sidebar'), bd = document.getElementById('sidebar-backdrop');
      function openSb() { sb.classList.remove('-translate-x-full'); bd.classList.remove('hidden'); }
      function closeSb() { sb.classList.add('-translate-x-full'); bd.classList.add('hidden'); }
      var o = document.getElementById('open-sidebar'); if (o) o.addEventListener('click', openSb);
      var c = document.getElementById('close-sidebar'); if (c) c.addEventListener('click', closeSb);
      if (bd) bd.addEventListener('click', closeSb);
    })();
  </script>
  <script>
    (function () {
      var PAGES = {
        public: [
          { id: 'untitled', title: 'Untitled', who: 'Z', color: '#1b5f8a', star: false },
          { id: 'project-design-spec', title: 'Project Design Spec', who: 'P', color: '#7c3aed', star: false }
        ],
        private: [],
        archived: []
      };
      var tabEls = document.querySelectorAll('.pg-tab');
      var tab = 'public';
      var IC_DOC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-sub shrink-0"><path d="M8 3h6l4 4v13a1 1 0 01-1 1H8a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
      var IC_TAG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 12l7-7h7a2 2 0 012 2v7l-7 7-9-9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="14.5" cy="9.5" r="1.3" fill="currentColor"/></svg>';
      var IC_PALETTE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 100 18 2.5 2.5 0 002.5-2.5c0-.7-.3-1.3-.3-1.9 0-.6.5-1.1 1.1-1.1H17a4 4 0 004-4c0-4.4-4-8.5-9-8.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10" cy="7.5" r="1" fill="currentColor"/><circle cx="14" cy="7.5" r="1" fill="currentColor"/></svg>';
      var IC_MENU = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>';
      function star(on) { return on ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="text-warning"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9L12 3z"/></svg>' : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9L12 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'; }

      function titleFmt(cell) {
        var p = cell.getData();
        return '<div class="flex items-center gap-3 min-w-0">' + IC_DOC + '<span class="text-[14px] text-ink truncate">' + p.title + '</span></div>';
      }
      function metaFmt(cell) {
        var p = cell.getData();
        return '<div class="flex items-center justify-end gap-1">' +
          '<span class="pg-hover flex items-center gap-1 text-faint">' +
            '<button class="h-7 w-7 grid place-items-center rounded hover:bg-line" title="Labels">' + IC_TAG + '</button>' +
            '<button class="h-7 w-7 grid place-items-center rounded hover:bg-line" title="Color">' + IC_PALETTE + '</button>' +
          '</span>' +
          '<span class="h-6 w-6 rounded-full text-white grid place-items-center text-[10px] font-bold" style="background:' + p.color + '">' + p.who + '</span>' +
          '<button data-star="' + p.id + '" class="h-7 w-7 grid place-items-center rounded hover:bg-line ' + (p.star ? '' : 'text-faint') + '" title="Favorite">' + star(p.star) + '</button>' +
          '<button data-pmenu="' + p.id + '" class="h-7 w-7 grid place-items-center rounded hover:bg-line text-faint" title="More">' + IC_MENU + '</button>' +
        '</div>';
      }

      var table = new Tabulator('#pg-table', {
        data: PAGES.public,
        index: 'id',
        layout: 'fitColumns',
        headerVisible: false,
        rowHeight: 44,
        placeholder: "<div class='py-20 flex flex-col items-center text-center'><svg width='44' height='44' viewBox='0 0 24 24' fill='none' class='text-faint'><path d='M8 3h6l4 4v13a1 1 0 01-1 1H8a1 1 0 01-1-1V4a1 1 0 011-1z' stroke='currentColor' stroke-width='1.5' stroke-linejoin='round'/><path d='M14 3v4h4' stroke='currentColor' stroke-width='1.5'/></svg><div class='text-[14px] font-semibold text-head mt-3'>No pages here</div><div class='text-[13px] text-sub mt-1'>Create a page to get started.</div></div>",
        columnDefaults: { vertAlign: 'middle', headerSort: false, resizable: false },
        columns: [
          { title: 'Title', field: 'title', widthGrow: 1, formatter: titleFmt },
          { title: 'meta', width: 170, hozAlign: 'right', formatter: metaFmt }
        ]
      });

      var tableEl = document.getElementById('pg-table');
      // Row click → open the page (unless a row action button was clicked)
      table.on('rowClick', function (e, row) {
        if (e.target.closest('button')) return;
        location.href = 'page.html?title=' + encodeURIComponent(row.getData().title);
      });
      // Star / more actions
      tableEl.addEventListener('click', function (e) {
        var s = e.target.closest('[data-star]');
        if (s) {
          e.stopPropagation();
          var row = table.getRow(s.getAttribute('data-star'));
          if (row) { var d = row.getData(); d.star = !d.star; row.update({ star: d.star }); row.reformat(); }
          return;
        }
        if (e.target.closest('[data-pmenu]')) { e.stopPropagation(); }
      });

      function paintTabs() { tabEls.forEach(function (t) { var on = t.getAttribute('data-ptab') === tab; t.className = 'pg-tab h-11 flex items-center -mb-px border-b-2 text-[13px] ' + (on ? 'border-brand text-ink font-medium' : 'border-transparent text-sub hover:text-ink'); }); }
      tabEls.forEach(function (t) { t.addEventListener('click', function () { tab = t.getAttribute('data-ptab'); paintTabs(); table.replaceData(PAGES[tab]); }); });
      paintTabs();
    })();
  </script>
</body>
</html>
