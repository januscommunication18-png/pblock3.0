<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace settings · Members — Project Block</title>

  <!--
    Project Block — Workspace settings · Members (setting-member.html)
    Focused two-column layout. Header: back · title · close (create-workspace style).
    Components: SettingsNav · MembersTable (future Vue routes /settings/*).
    Look & feel: Project Block. Tokens in assets/js/tailwind.config.js.
  -->

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />

  <!-- Tabulator (data table) + our skin -->
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6/dist/css/tabulator.min.css" />
  <link rel="stylesheet" href="assets/css/tabulator-skin.css" />
  <script src="https://unpkg.com/tabulator-tables@6/dist/js/tabulator.min.js"></script>
</head>
<body class="bg-white text-ink text-[13px] h-screen flex flex-col overflow-hidden">

  <!-- Minimal header (create-workspace style): back · title · close -->
  <header class="relative h-14 shrink-0 border-b border-line flex items-center px-4">
    <a href="welcome.html" title="Back" class="h-9 w-9 grid place-items-center rounded-md text-sub hover:bg-hover">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <span class="absolute left-1/2 -translate-x-1/2 font-semibold text-[15px] text-head">Workspace settings</span>
    <div class="ml-auto flex items-center gap-2">
      <span class="h-6 w-px bg-line"></span>
      <a href="welcome.html" title="Close" class="h-9 w-9 grid place-items-center rounded-md text-sub hover:bg-hover">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
    </div>
  </header>

  <div class="flex-1 flex min-h-0 relative">

    <!-- backdrop (mobile drawer) -->
    <div id="settings-backdrop" class="hidden md:hidden fixed inset-0 bg-black/30 z-30"></div>

    <!-- ============ component: SettingsNav ============ -->
    <aside id="settings-nav" class="w-64 shrink-0 border-r border-line bg-white flex flex-col
           fixed md:relative inset-y-0 left-0 z-40 -translate-x-full md:translate-x-0 transition-transform duration-200">
      <div class="md:hidden flex justify-end px-2 h-12 items-center shrink-0">
        <button id="close-nav" class="h-8 w-8 grid place-items-center rounded-md text-sub hover:bg-hover">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <nav id="settings-list" class="flex-1 overflow-y-auto pt-2 pb-4"></nav>
    </aside>

    <!-- ============ CONTENT ============ -->
    <main class="flex-1 min-w-0 flex flex-col">
      <div class="h-12 shrink-0 border-b border-line flex items-center gap-2 px-4 sm:px-6">
        <button id="open-nav" class="md:hidden h-8 w-8 grid place-items-center rounded-md text-sub hover:bg-hover -ml-1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="flex items-center gap-1.5 text-[13px] text-sub">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M3 19a6 6 0 0112 0M16 6a3 3 0 010 6M20 19a6 6 0 00-3-5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Members
        </span>
      </div>

      <div class="flex-1 overflow-auto">
        <div class="px-5 sm:px-8 py-8">
          <h1 class="text-[24px] font-bold text-head">Members</h1>
          <p class="text-[14px] text-sub mt-0.5">Manage access to this workspace.</p>

          <!-- Tabs + toolbar -->
          <div class="flex flex-wrap items-center gap-3 mt-6 border-b border-line">
            <div class="flex items-center gap-5">
              <button data-tab="people" class="pb-tab pb-2 -mb-px border-b-2 border-brand text-ink font-medium text-[14px]">People</button>
              <button data-tab="pending" class="pb-tab pb-2 -mb-px border-b-2 border-transparent text-sub hover:text-ink text-[14px]">Pending Invites</button>
            </div>
            <div class="ml-auto flex items-center gap-2 pb-2">
              <div class="relative">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" class="absolute left-2.5 top-1/2 -translate-y-1/2 text-faint"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input type="text" placeholder="Search..." class="h-9 w-40 sm:w-52 rounded-md bg-white pl-8 pr-3 text-[13px] outline outline-1 -outline-offset-1 outline-stroke focus:outline-2 focus:-outline-offset-2 focus:outline-brand" />
              </div>
              <button class="h-9 px-3 rounded-md border border-stroke text-[13px] text-ink hover:bg-hover flex items-center gap-1.5">Filters <svg width="13" height="13" viewBox="0 0 24 24" fill="none" class="text-faint"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <button class="h-9 px-3 rounded-md border border-stroke text-[13px] text-ink hover:bg-hover">Import</button>
              <button id="add-member-btn" class="h-9 px-3 rounded-md bg-brand hover:bg-brand-dark text-white text-[13px] font-semibold">Add member</button>
            </div>
          </div>

          <!-- Panel: People -->
          <div id="panel-people">
            <!-- Members: Tabulator table on md+, card list on mobile -->
            <div id="members-table" class="mt-4 hidden md:block"></div>
            <div id="members-cards" class="mt-4 space-y-3 md:hidden"></div>
          </div>

          <!-- Panel: Pending Invites -->
          <div id="panel-pending" class="hidden">
            <div id="pending-list" class="mt-4 space-y-2"></div>
            <div id="pending-empty" class="hidden mt-10 flex flex-col items-center justify-center text-center py-10">
              <div class="h-12 w-12 rounded-full bg-hover grid place-items-center text-faint mb-3"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <div class="text-[14px] font-medium text-ink">No pending invites</div>
              <div class="text-[13px] text-sub mt-1">Invitations you send will appear here until they're accepted.</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- component: InviteModal (Add member) -->
  <div id="invite-modal" class="hidden fixed inset-0 z-50 flex items-start justify-center p-4 sm:pt-24">
    <div class="absolute inset-0 bg-black/40" data-close></div>
    <div class="relative w-full max-w-[640px] bg-white rounded-xl shadow-xl p-6">
      <h2 class="text-[18px] font-semibold text-head">Invite people to collaborate</h2>
      <p class="text-[13px] text-sub mt-1 mb-5">Invite people to collaborate on your workspace.</p>
      <div id="invite-rows" class="space-y-3"></div>
      <div class="flex items-center justify-between mt-4">
        <button id="invite-add" class="flex items-center gap-1.5 text-[13px] font-semibold text-link hover:underline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add more
        </button>
        <div class="flex items-center gap-2">
          <button data-close class="h-9 px-4 rounded-md border border-stroke text-[13px] font-semibold text-ink hover:bg-hover">Cancel</button>
          <button id="invite-send" class="h-9 px-4 rounded-md bg-brand hover:bg-brand-dark text-white text-[13px] font-semibold">Send invitations</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared row quick-action menu (floating; avoids Tabulator cell clipping) -->
  <div id="row-menu" class="hidden fixed z-50 w-40 bg-white border border-line rounded-md shadow-lg py-1 text-[13px]">
    <button data-act="view" class="w-full flex items-center gap-2 px-3 h-8 text-ink hover:bg-hover text-left"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7"/></svg>View</button>
    <button data-act="edit" class="w-full flex items-center gap-2 px-3 h-8 text-ink hover:bg-hover text-left"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Edit</button>
    <button data-act="delete" class="w-full flex items-center gap-2 px-3 h-8 text-danger hover:bg-red-50 text-left"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Delete</button>
  </div>

  <script>
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    // ---- Settings navigation ----
    var NAV = [
      { h: 'Administration', items: ['General', 'Members', 'Billing and plans', 'Imports', 'Exports'] },
      { h: 'Products', items: ['Wiki', 'Project Block AI'] },
      { h: 'Features', items: ['Projects', 'Teamspaces', 'Initiatives', 'Customers', 'Templates', 'Integrations', 'Connections', 'Releases'] },
      { h: 'Developers', items: ['Webhooks', 'Access Tokens'] }
    ];
    var ACTIVE = 'Members';
    var SOON = ['Templates', 'Integrations'];
    var ICONS = {
      'General': '<path d="M6 4v6M6 14v6M12 4v1M12 9v11M18 4v9M18 17v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="6" cy="12" r="2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="7" r="2" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="15" r="2" stroke="currentColor" stroke-width="1.6"/>',
      'Members': '<circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M3 19a6 6 0 0112 0M16 6a3 3 0 010 6M21 19a6 6 0 00-3-5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      'Billing and plans': '<rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/>',
      'Imports': '<path d="M12 3v10M8 9l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      'Exports': '<path d="M12 13V3M8 7l4-4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      'Wiki': '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
      'Project Block AI': '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
      'Projects': '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
      'Teamspaces': '<circle cx="7" cy="8" r="2.4" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="8" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 18a4.5 4.5 0 019 0M12.5 18a4.5 4.5 0 019 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      'Initiatives': '<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>',
      'Customers': '<path d="M4 21V5a1 1 0 011-1h8a1 1 0 011 1v16" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 21V10h4a1 1 0 011 1v10" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 8h3M7 12h3M7 16h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      'Templates': '<rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4 9h16M9 9v10" stroke="currentColor" stroke-width="1.6"/>',
      'Integrations': '<rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>',
      'Connections': '<path d="M9 15l6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10.5 6.5l1-1a3.5 3.5 0 015 5l-1 1M13.5 17.5l-1 1a3.5 3.5 0 01-5-5l1-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
      'Releases': '<path d="M4 4h9l7 7-9 9-7-7V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/>',
      'Webhooks': '<path d="M13 3L5 13h6l-1 8 8-11h-6l1-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
      'Access Tokens': '<circle cx="8" cy="14" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 11.5L20 2M17 5l2 2M14 8l2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
    };
    function navIcon(label) {
      return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="shrink-0 text-head">' + (ICONS[label] || '<rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/>') + '</svg>';
    }
    var LINKS = { 'General': 'setting-general.html', 'Members': 'setting-member.html', 'Wiki': 'setting-wiki.html', 'Projects': 'setting-projects.html', 'Teamspaces': 'setting-teamspaces.html', 'Initiatives': 'setting-initiatives.html', 'Customers': 'setting-customers.html', 'Releases': 'setting-releases.html' };
    document.getElementById('settings-list').innerHTML = NAV.map(function (sec) {
      return '<div class="px-2 mt-4">' +
        '<div class="px-2 h-6 flex items-center text-[11px] font-semibold text-faint uppercase tracking-wide">' + sec.h + '</div>' +
        sec.items.map(function (it) {
          var a = it === ACTIVE;
          if (SOON.indexOf(it) > -1) {
            return '<span class="flex items-center gap-2.5 px-2 h-8 rounded-md text-[13px] text-faint cursor-not-allowed select-none">' + navIcon(it).replace('text-head', 'text-faint') + '<span>' + it + '</span><span class="ml-auto text-[10px] font-medium text-sub bg-hover rounded px-1.5 py-0.5">Soon</span></span>';
          }
          return '<a href="' + (LINKS[it] || '#') + '" class="flex items-center gap-2.5 px-2 h-8 rounded-md text-[13px] cursor-pointer ' + (a ? 'bg-sel text-ink font-medium' : 'text-ink hover:bg-hover') + '">' + navIcon(it) + it + '</a>';
        }).join('') +
        '</div>';
    }).join('');

    // ---- Members table (Tabulator, skinned) ----
    var FIRST = ['Rohit', 'Leslie', 'Michael', 'Dries', 'Courtney', 'Tom', 'Whitney', 'Leonard', 'Floyd', 'Emily', 'Kristin', 'Emma', 'Wade', 'Arlene', 'Devon', 'Jane', 'Kathryn', 'Jacob', 'Marvin', 'Cody', 'Bessie', 'Ronald', 'Guy', 'Jenny', 'Darlene'];
    var LAST = ['Philip', 'Alexander', 'Foster', 'Vincent', 'Henry', 'Cook', 'Francis', 'Krause', 'Miles', 'Selman', 'Watson', 'Dorwart', 'Cooper', 'Mccoy', 'Webb', 'Murphy', 'Murphy', 'Jones', 'McKinney', 'Fisher', 'Richards', 'Richards', 'Hawkins', 'Wilson', 'Robertson'];
    var ROLES = ['Admin', 'Member', 'Viewer', 'Guest'];
    var AUTH = ['Magic code', 'Google', 'GitHub', 'SSO'];
    var AV = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#0ea5e9'];

    var MEMBERS = [];
    for (var i = 0; i < 25; i++) {
      var m;
      if (i === 0) m = { name: 'Rohit Philip', display: 'zorainteractive', email: 'zorainteractive@gmail.com', role: 'Owner', billing: 'Active', auth: 'Magic code', joined: 'Aug 07, 2026' };
      else {
        var f = FIRST[i], l = LAST[i], disp = (f + l).toLowerCase();
        m = { name: f + ' ' + l, display: disp, email: disp + '@company.com', role: ROLES[i % ROLES.length], billing: (i % 3 === 0 ? 'Inactive' : 'Active'), auth: AUTH[i % AUTH.length], joined: 'Aug ' + pad((i % 28) + 1) + ', 2026' };
      }
      m.color = AV[i % AV.length];
      m.av = m.name.charAt(0);
      MEMBERS.push(m);
    }

    var actEye = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7"/></svg>';
    var actEdit = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var actDel = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function nameFormatter(cell) {
      var d = cell.getRow().getData();
      return '<span class="flex items-center gap-2.5"><span class="h-6 w-6 rounded-full text-white grid place-items-center text-[10px] font-bold shrink-0" style="background:' + d.color + '">' + d.av + '</span><span class="text-ink whitespace-nowrap">' + d.name + '</span></span>';
    }
    function billFormatter(cell) {
      var v = cell.getValue(); var dot = (v === 'Active') ? 'bg-success' : 'bg-faint';
      return '<span class="inline-flex items-center gap-1.5 whitespace-nowrap text-ink"><span class="h-1.5 w-1.5 rounded-full ' + dot + '"></span>' + v + '</span>';
    }
    function actionFormatter() {
      return '<button type="button" class="pb-quickaction inline-flex items-center gap-1 h-7 pl-2.5 pr-2 rounded-md border border-stroke text-[12px] text-ink hover:bg-hover">Actions<svg width="12" height="12" viewBox="0 0 24 24" fill="none" class="text-faint"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
    }

    var membersTable = new Tabulator('#members-table', {
      data: MEMBERS,
      layout: 'fitColumns',
      columnDefaults: { vertAlign: 'middle' },
      pagination: true,
      paginationSize: 10,
      paginationCounter: 'rows',
      columns: [
        { title: 'Full name', field: 'name', minWidth: 190, widthGrow: 2, formatter: nameFormatter },
        { title: 'Display name', field: 'display', minWidth: 130 },
        { title: 'Email', field: 'email', minWidth: 210, widthGrow: 2 },
        { title: 'Role', field: 'role', minWidth: 90 },
        { title: 'Billing Status', field: 'billing', minWidth: 120, formatter: billFormatter },
        { title: 'Authentication', field: 'auth', minWidth: 130 },
        { title: 'Joining date', field: 'joined', minWidth: 120 },
        { title: 'Action', field: 'action', headerSort: false, minWidth: 120, formatter: actionFormatter }
      ]
    });
    // Redraw the table when returning to desktop width (it inits hidden on mobile)
    window.addEventListener('resize', function () { if (window.innerWidth >= 768) membersTable.redraw(true); });

    // ---- Mobile card list (same data) ----
    var quickBtn = '<button type="button" class="pb-quickaction inline-flex items-center gap-1 h-7 pl-2.5 pr-2 rounded-md border border-stroke text-[12px] text-ink hover:bg-hover shrink-0">Actions<svg width="12" height="12" viewBox="0 0 24 24" fill="none" class="text-faint"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
    function mfield(label, val) {
      return '<div><div class="text-[11px] font-medium text-faint uppercase tracking-wide">' + label + '</div><div class="text-[13px] text-ink truncate">' + val + '</div></div>';
    }
    document.getElementById('members-cards').innerHTML = MEMBERS.map(function (m) {
      return '<div class="border border-line rounded-lg p-4">' +
        '<div class="flex items-center gap-3">' +
          '<span class="h-9 w-9 rounded-full text-white grid place-items-center text-[12px] font-bold shrink-0" style="background:' + m.color + '">' + m.av + '</span>' +
          '<div class="min-w-0 flex-1"><div class="text-[14px] font-medium text-ink truncate">' + m.name + '</div><div class="text-[12px] text-sub truncate">' + m.email + '</div></div>' +
          quickBtn +
        '</div>' +
        '<div class="grid grid-cols-2 gap-x-4 gap-y-2.5 mt-3">' +
          mfield('Display name', m.display) +
          mfield('Role', m.role) +
          '<div><div class="text-[11px] font-medium text-faint uppercase tracking-wide">Billing</div><div class="text-[13px] text-ink inline-flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full ' + (m.billing === 'Active' ? 'bg-success' : 'bg-faint') + '"></span>' + m.billing + '</div></div>' +
          mfield('Authentication', m.auth) +
          mfield('Joining date', m.joined) +
        '</div>' +
        '</div>';
    }).join('');

    // ---- Pending invites ----
    var PENDING = [
      { email: 'sarah.lin@company.com', role: 'Member', invited: 'Aug 06, 2026', by: 'Rohit Philip' },
      { email: 'james.wu@company.com', role: 'Admin', invited: 'Aug 05, 2026', by: 'Rohit Philip' },
      { email: 'nadia.rahman@vendor.io', role: 'Guest', invited: 'Aug 04, 2026', by: 'Rohit Philip' },
      { email: 'derek.owens@company.com', role: 'Viewer', invited: 'Aug 02, 2026', by: 'Rohit Philip' }
    ];
    (function () {
      var wrap = document.getElementById('pending-list');
      var empty = document.getElementById('pending-empty');
      if (!PENDING.length) { empty.classList.remove('hidden'); return; }
      wrap.innerHTML = PENDING.map(function (p) {
        return '<div class="flex flex-wrap items-center gap-3 border border-line rounded-lg px-4 py-3">' +
          '<span class="h-8 w-8 rounded-full bg-hover text-sub grid place-items-center text-[13px] font-semibold shrink-0">' + p.email.charAt(0).toUpperCase() + '</span>' +
          '<div class="min-w-0 flex-1">' +
            '<div class="text-[14px] text-ink truncate">' + p.email + '</div>' +
            '<div class="text-[12px] text-sub">Invited ' + p.invited + ' by ' + p.by + '</div>' +
          '</div>' +
          '<span class="text-[12px] font-medium text-sub bg-hover rounded px-2 py-0.5 shrink-0">' + p.role + '</span>' +
          '<span class="text-[12px] font-medium text-warning bg-amber-50 rounded px-2 py-0.5 shrink-0">Pending</span>' +
          '<div class="flex items-center gap-1.5 shrink-0">' +
            '<button class="h-8 px-3 rounded-md border border-stroke text-[13px] text-ink hover:bg-hover whitespace-nowrap">Resend</button>' +
            '<button class="h-8 px-3 rounded-md border border-stroke text-[13px] text-danger hover:bg-red-50 whitespace-nowrap">Revoke</button>' +
          '</div>' +
        '</div>';
      }).join('');
    })();

    // ---- Tab switching (People / Pending Invites) ----
    (function () {
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.pb-tab'));
      var panels = { people: document.getElementById('panel-people'), pending: document.getElementById('panel-pending') };
      function activate(name) {
        if (!panels[name]) name = 'people';
        tabs.forEach(function (t) {
          var on = t.getAttribute('data-tab') === name;
          t.classList.toggle('border-brand', on);
          t.classList.toggle('text-ink', on);
          t.classList.toggle('font-medium', on);
          t.classList.toggle('border-transparent', !on);
          t.classList.toggle('text-sub', !on);
        });
        Object.keys(panels).forEach(function (k) { panels[k].classList.toggle('hidden', k !== name); });
        if (name === 'people' && window.innerWidth >= 768) membersTable.redraw(true);
      }
      tabs.forEach(function (t) {
        t.addEventListener('click', function () {
          var name = t.getAttribute('data-tab');
          activate(name);
          history.replaceState(null, '', name === 'pending' ? '#pending' : location.pathname);
        });
      });
      if (location.hash === '#pending') activate('pending');
    })();

    // ---- Mobile drawer ----
    var nav = document.getElementById('settings-nav');
    var bd = document.getElementById('settings-backdrop');
    function openNav() { nav.classList.remove('-translate-x-full'); bd.classList.remove('hidden'); }
    function closeNav() { nav.classList.add('-translate-x-full'); bd.classList.add('hidden'); }
    document.getElementById('open-nav').addEventListener('click', openNav);
    document.getElementById('close-nav').addEventListener('click', closeNav);
    bd.addEventListener('click', closeNav);

    // ---- Invite modal (Add member) ----
    var IROLES = ['Admin', 'Member', 'Viewer', 'Guest'];
    var modal = document.getElementById('invite-modal');
    var irows = document.getElementById('invite-rows');
    var ir = 1;
    function iRoleOpts() {
      return IROLES.map(function (r) {
        return '<li role="option" class="group relative flex items-center cursor-pointer select-none py-2 pl-3 pr-9 text-[14px] text-ink hover:bg-brand hover:text-white"><span class="pb-opt-content truncate">' + r + '</span><span class="pb-combo-check hidden absolute inset-y-0 right-0 flex items-center pr-3 text-brand group-hover:text-white"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></li>';
      }).join('');
    }
    function iRow() {
      return '<div class="grid grid-cols-[1fr_150px] gap-3">' +
        '<input type="email" placeholder="name@company.com" class="pb-input" />' +
        '<div class="relative pb-combo"><button type="button" class="pb-combo-btn pb-input text-left cursor-pointer" aria-haspopup="listbox"><span class="flex items-center justify-between h-full"><span class="pb-combo-value text-faint truncate">Select role</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-faint shrink-0 ml-1"><path d="M8 9l4-4 4 4M8 15l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button><ul role="listbox" class="pb-combo-list hidden absolute z-50 mt-1 w-full max-h-56 overflow-auto rounded-md bg-white py-1 shadow-lg outline outline-1 outline-black/5">' + iRoleOpts() + '</ul></div>' +
        '</div>';
    }
    function iRender() { var h = ''; for (var i = 0; i < ir; i++) h += iRow(); irows.innerHTML = h; }
    function openModal() { ir = 1; iRender(); modal.classList.remove('hidden'); }
    function closeModal() { modal.classList.add('hidden'); }
    document.getElementById('add-member-btn').addEventListener('click', openModal);
    document.getElementById('invite-add').addEventListener('click', function () { ir++; iRender(); });
    document.getElementById('invite-send').addEventListener('click', closeModal);
    modal.addEventListener('click', function (e) { if (e.target.closest('[data-close]')) closeModal(); });

    // Role combobox inside the modal (delegated)
    function iCloseAll() { irows.querySelectorAll('.pb-combo-list').forEach(function (u) { u.classList.add('hidden'); }); }
    irows.addEventListener('click', function (e) {
      var btn = e.target.closest('.pb-combo-btn');
      if (btn) {
        e.stopPropagation();
        var ul = btn.parentElement.querySelector('.pb-combo-list');
        var open = ul.classList.contains('hidden');
        iCloseAll();
        if (open) ul.classList.remove('hidden');
        return;
      }
      var li = e.target.closest('.pb-combo-list li');
      if (li) {
        var combo = li.closest('.pb-combo');
        var v = combo.querySelector('.pb-combo-value');
        v.textContent = li.querySelector('.pb-opt-content').textContent;
        v.classList.remove('text-faint'); v.classList.add('text-ink');
        combo.querySelectorAll('.pb-combo-check').forEach(function (c) { c.classList.add('hidden'); });
        li.querySelector('.pb-combo-check').classList.remove('hidden');
        combo.querySelector('.pb-combo-list').classList.add('hidden');
      }
    });
    document.addEventListener('click', function (e) { if (!modal.classList.contains('hidden') && !e.target.closest('.pb-combo')) iCloseAll(); });

    // ---- Row quick-action menu (shared, floating) ----
    (function () {
      var menu = document.getElementById('row-menu');
      if (!menu) return;
      function hide() { menu.classList.add('hidden'); }
      document.addEventListener('click', function (e) {
        var btn = e.target.closest('.pb-quickaction');
        if (btn) {
          e.stopPropagation();
          menu.classList.remove('hidden');
          var w = menu.offsetWidth || 160;
          var r = btn.getBoundingClientRect();
          var left = r.right - w; // right-align menu to the button so it opens leftward
          menu.style.left = Math.max(8, left) + 'px';
          menu.style.top = (r.bottom + 4) + 'px';
          return;
        }
        if (e.target.closest('#row-menu [data-act]')) { hide(); return; }
        hide();
      });
      // keep it anchored: hide on any scroll (fixed menu won't follow the row)
      document.addEventListener('scroll', hide, true);
      window.addEventListener('resize', hide);
    })();
  </script>
</body>
</html>
